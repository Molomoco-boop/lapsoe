name: Refresh highlights cache

# Genera la portada impactante sin tu PC (GitHub Actions gratis)
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC diario
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build highlights.json
        run: python scripts/build_highlights_ci.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/highlights.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh homepage highlights cache"
            git push
          fi
